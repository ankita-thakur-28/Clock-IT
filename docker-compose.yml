services:
  # ─── 1. PostgreSQL 16 Database Service ───
  postgres:
    image: postgres:16-alpine
    container_name: clockit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clockit_db
      POSTGRES_USER: clockit_user
      POSTGRES_PASSWORD: clockit_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockit_user -d clockit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Spring Boot 4.x Backend API Service ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clockit-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clockit_db
      SPRING_DATASOURCE_USERNAME: clockit_user
      SPRING_DATASOURCE_PASSWORD: clockit_secure_password_2026
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── 3. Expo Web Frontend Nginx Service ───
  frontend:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:8088/api
    container_name: clockit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  pgdata:
    driver: local

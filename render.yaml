services:
  # ─── 1. Spring Boot 4 Backend REST API Web Service ───
  - type: web
    name: clockit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8088
      - key: DATABASE_URL
        fromDatabase:
          name: clockit-postgres
          property: connectionString

  # ─── 2. Expo Web Frontend Static Site ───
  - type: web
    name: clockit-frontend
    runtime: static
    buildCommand: cd mobile && npm install && npx expo export -p web
    staticPublishPath: ./mobile/dist
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ─── 3. Managed PostgreSQL 16 Database ───
databases:
  - name: clockit-postgres
    databaseName: clockit_db
    user: clockit_user
    plan: free
    region: oregon
